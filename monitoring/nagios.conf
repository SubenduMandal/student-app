# ==============================
# NAGIOS MAIN CONFIG (BASIC)
# ==============================

# Load object configuration files
cfg_file=commands.cfg
cfg_file=hosts.cfg
cfg_file=services.cfg

# Log file
log_file=/usr/local/var/nagios/nagios.log

# Status file
status_file=/usr/local/var/nagios/status.dat

# Check result directory
check_result_path=/usr/local/var/nagios/spool/checkresults

# External command file
command_file=/usr/local/var/nagios/rw/nagios.cmd

# Lock file
lock_file=/usr/local/var/nagios/nagios.lock

# Enable notifications
enable_notifications=1

# Execute service checks
execute_service_checks=1

# Accept passive service checks
accept_passive_service_checks=1

# Check service freshness
check_service_freshness=1